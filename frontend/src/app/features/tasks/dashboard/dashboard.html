<app-shell>
  <div class="max-w-7xl mx-auto animate-fade-in">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
      <div>
        <h2 class="text-xl font-semibold text-slate-900 dark:text-white tracking-tight">
          @if (isAdmin()) {
            All tasks
          } @else {
            Your board
          }
        </h2>
        <p class="mt-0.5 text-sm text-slate-500 dark:text-slate-400">
          @if (isAdmin()) {
            Manage every task in the workspace across all members.
          } @else {
            Stay organised by moving tasks between Todo, In Progress and Completed.
          }
        </p>
      </div>
      <button
        type="button"
        class="inline-flex items-center justify-center gap-1.5 px-3.5 py-2 text-sm font-medium text-white bg-slate-900 dark:bg-brand-600 rounded-md hover:bg-slate-800 dark:hover:bg-brand-500 transition-colors"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14" />
        </svg>
        New task
      </button>
    </div>

    <div class="rounded-xl border border-dashed border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900/50 p-12 text-center">
      <div class="mx-auto w-12 h-12 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 mb-3">
        <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2" />
        </svg>
      </div>
      <p class="text-sm font-medium text-slate-900 dark:text-white">Task board coming up next</p>
      <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
        Kanban columns and task cards will render here.
      </p>
    </div>
  </div>
</app-shell>
