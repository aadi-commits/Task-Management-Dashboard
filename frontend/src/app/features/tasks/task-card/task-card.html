<article
  class="group relative p-3.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg hover:shadow-card-hover hover:border-slate-300 dark:hover:border-slate-700 transition-all cursor-pointer"
  (click)="openCard()"
  role="button"
  tabindex="0"
  (keydown.enter)="openCard()"
  (keydown.space)="$event.preventDefault(); openCard()"
>
  <div class="flex items-start justify-between gap-2">
    <h4 class="text-sm font-medium text-slate-900 dark:text-white leading-snug pr-1 line-clamp-2">
      {{ task().title }}
    </h4>
    <button
      type="button"
      (click)="toggleMenu($event)"
      class="shrink-0 -mt-1 -mr-1 p-1 rounded text-slate-400 hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-slate-200 opacity-0 group-hover:opacity-100 focus:opacity-100 transition-opacity"
      [attr.aria-expanded]="menuOpen()"
      aria-haspopup="menu"
      aria-label="Task actions"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <circle cx="12" cy="5" r="1" />
        <circle cx="12" cy="12" r="1" />
        <circle cx="12" cy="19" r="1" />
      </svg>
    </button>

    @if (menuOpen()) {
      <div
        class="absolute right-2 top-9 z-10 w-44 rounded-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-card-hover animate-scale-in"
        role="menu"
      >
        <p class="px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 border-b border-slate-100 dark:border-slate-800">
          Move to
        </p>
        @for (s of statuses; track s) {
          <button
            type="button"
            (click)="changeStatus(s, $event)"
            [disabled]="s === task().status"
            class="flex items-center justify-between w-full px-3 py-2 text-xs text-left text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-50 disabled:cursor-default disabled:hover:bg-transparent"
            role="menuitem"
          >
            <span class="flex items-center gap-2">
              <span
                class="w-1.5 h-1.5 rounded-full"
                [class.bg-slate-400]="s === 'todo'"
                [class.bg-amber-500]="s === 'in-progress'"
                [class.bg-emerald-500]="s === 'completed'"
              ></span>
              {{ statusLabel[s] }}
            </span>
            @if (s === task().status) {
              <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="m5 12 5 5L20 7" />
              </svg>
            }
          </button>
        }
        <div class="border-t border-slate-100 dark:border-slate-800 my-1"></div>
        <button
          type="button"
          (click)="triggerEdit($event)"
          class="flex items-center gap-2 w-full px-3 py-2 text-xs text-left text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800"
          role="menuitem"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5Z" />
          </svg>
          Edit
        </button>
        <button
          type="button"
          (click)="triggerDelete($event)"
          class="flex items-center gap-2 w-full px-3 py-2 text-xs text-left text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-500/10"
          role="menuitem"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14ZM10 11v6M14 11v6" />
          </svg>
          Delete
        </button>
      </div>
    }
  </div>

  <div class="mt-3 flex items-center justify-between gap-2">
    <div class="flex items-center gap-1.5 flex-wrap">
      <span
        class="inline-flex items-center gap-1 px-1.5 py-0.5 text-[10px] font-medium rounded"
        [class.bg-slate-100]="task().priority === 'low'"
        [class.text-slate-700]="task().priority === 'low'"
        [class.dark:bg-slate-800]="task().priority === 'low'"
        [class.dark:text-slate-300]="task().priority === 'low'"
        [class.bg-amber-100]="task().priority === 'medium'"
        [class.text-amber-700]="task().priority === 'medium'"
        [class.dark:bg-amber-500/15]="task().priority === 'medium'"
        [class.dark:text-amber-400]="task().priority === 'medium'"
        [class.bg-rose-100]="task().priority === 'high'"
        [class.text-rose-700]="task().priority === 'high'"
        [class.dark:bg-rose-500/15]="task().priority === 'high'"
        [class.dark:text-rose-400]="task().priority === 'high'"
      >
        <svg class="w-2.5 h-2.5" fill="currentColor" viewBox="0 0 8 8">
          <circle cx="4" cy="4" r="3" />
        </svg>
        {{ priorityLabel[task().priority] }}
      </span>

      @if (task().dueDate; as due) {
        <span
          class="inline-flex items-center gap-1 px-1.5 py-0.5 text-[10px] font-medium rounded"
          [class.bg-slate-100]="dueState() === 'normal'"
          [class.text-slate-700]="dueState() === 'normal'"
          [class.dark:bg-slate-800]="dueState() === 'normal'"
          [class.dark:text-slate-300]="dueState() === 'normal'"
          [class.bg-amber-100]="dueState() === 'soon'"
          [class.text-amber-700]="dueState() === 'soon'"
          [class.dark:bg-amber-500/15]="dueState() === 'soon'"
          [class.dark:text-amber-400]="dueState() === 'soon'"
          [class.bg-rose-100]="dueState() === 'overdue'"
          [class.text-rose-700]="dueState() === 'overdue'"
          [class.dark:bg-rose-500/15]="dueState() === 'overdue'"
          [class.dark:text-rose-400]="dueState() === 'overdue'"
          [class.bg-emerald-100]="dueState() === 'done'"
          [class.text-emerald-700]="dueState() === 'done'"
          [class.dark:bg-emerald-500/15]="dueState() === 'done'"
          [class.dark:text-emerald-400]="dueState() === 'done'"
        >
          <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path stroke-linecap="round" d="M16 2v4M8 2v4M3 10h18" />
          </svg>
          {{ due | date: 'MMM d' }}
        </span>
      }
    </div>

    @if (isAdmin()) {
      <span
        class="flex items-center justify-center w-5 h-5 rounded-full bg-gradient-to-br from-brand-500 to-purple-600 text-[9px] font-semibold text-white"
        [title]="'Owner ID: ' + task().userId"
      >
        {{ ownerInitial() }}
      </span>
    }
  </div>
</article>

@if (menuOpen()) {
  <div class="fixed inset-0 z-[5]" (click)="closeMenu()" aria-hidden="true"></div>
}
