<div
  class="fixed inset-0 z-[60] flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-fade-in"
  (click)="onBackdropClick()"
  role="dialog"
  aria-modal="true"
>
  <div
    class="relative w-full sm:max-w-sm bg-white dark:bg-slate-900 rounded-t-2xl sm:rounded-2xl shadow-2xl border-t sm:border border-slate-200 dark:border-slate-800 animate-scale-in"
    (click)="$event.stopPropagation()"
  >
    <div class="px-5 sm:px-6 pt-5 pb-4">
      <div class="flex items-start gap-3">
        <div
          class="shrink-0 w-9 h-9 flex items-center justify-center rounded-full"
          [class.bg-rose-100]="tone() === 'danger'"
          [class.text-rose-600]="tone() === 'danger'"
          [class.dark:bg-rose-500/15]="tone() === 'danger'"
          [class.dark:text-rose-400]="tone() === 'danger'"
          [class.bg-slate-100]="tone() === 'default'"
          [class.text-slate-600]="tone() === 'default'"
          [class.dark:bg-slate-800]="tone() === 'default'"
          [class.dark:text-slate-300]="tone() === 'default'"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="text-sm font-semibold text-slate-900 dark:text-white">
            {{ title() }}
          </h3>
          <p class="mt-1 text-sm text-slate-600 dark:text-slate-400 leading-relaxed">
            {{ message() }}
          </p>
        </div>
      </div>
    </div>
    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 px-5 sm:px-6 py-3 bg-slate-50 dark:bg-slate-950/40 border-t border-slate-100 dark:border-slate-800 rounded-b-2xl">
      <button
        type="button"
        (click)="cancel.emit()"
        [disabled]="busy()"
        class="px-3.5 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-md hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-50 transition-colors"
      >
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        (click)="confirm.emit()"
        [disabled]="busy()"
        class="inline-flex items-center justify-center gap-1.5 px-3.5 py-2 text-sm font-medium text-white rounded-md disabled:opacity-60 disabled:cursor-not-allowed transition-colors"
        [class.bg-rose-600]="tone() === 'danger'"
        [class.hover:bg-rose-700]="tone() === 'danger'"
        [class.bg-slate-900]="tone() === 'default'"
        [class.hover:bg-slate-800]="tone() === 'default'"
        [class.dark:bg-brand-600]="tone() === 'default'"
        [class.dark:hover:bg-brand-500]="tone() === 'default'"
      >
        @if (busy()) {
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4Z"></path>
          </svg>
        }
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
