# Netlify build configuration for the frontend.
#
# Set the following environment variables in the Netlify dashboard:
#   API_URL = https://<your-backend-host>/api
#
# The build runs `npm run build`, which triggers the `prebuild` script in
# frontend/package.json. That script writes environment.prod.ts from API_URL
# before `ng build` produces the bundle.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: every unknown path should serve index.html so Angular's
# router can handle it client-side instead of returning a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
